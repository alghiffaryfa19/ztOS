# ABOX timer-based scheduling underruns despite low CPU load. Use its period
# interrupts and keep buffering margin; leave other audio devices unchanged.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-snd-zrn-abox.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size = 2048
        api.alsa.headroom = 2048
      }
    }
  }
]
